<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/maziturkiye/assets/favicon.png"><link rel="apple-touch-icon" href="/maziturkiye/assets/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;600&display=swap"><link rel="stylesheet" href="/maziturkiye/assets/site.css"><script src="/maziturkiye/assets/partials.js" defer></script>
<title>Meydan okuma · Mazi Türkiye</title>
<meta name="description" content="Bir arkadaşın sana Mazi Türkiye'de meydan okudu. Aynı 5 fotoğrafı oyna, skorunu karşılaştır.">
<meta property="og:title" content="Sana meydan okundu · Mazi Türkiye"><meta property="og:image" content="https://maziturkiye.com/assets/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
</head><body>
<div data-header></div>
<main class="wrap" style="text-align:center">
  <p class="label" id="num">Meydan okuma</p>
  <h1 id="title">Sana meydan okundu</h1>
  <p class="lead" style="margin:0 auto" id="sub">Aynı 5 fotoğrafı oyna, skorlarınızı karşılaştırın.</p>
  <div style="margin:28px 0"><div class="code" id="code">······</div></div>
  <p class="muted small">Uygulama yüklüyse bu link doğrudan açılır. Yüklü değilse indir; ilk açılışta bu kodu sor­duğumuzda yapıştır.</p>
  <div class="row" style="justify-content:center;margin:20px 0">
    <a class="btn" id="open" href="#">Uygulamada aç</a>
    <button class="btn secondary" id="copy" type="button">Kodu kopyala</button>
    <a class="btn secondary" id="store" href="#">Uygulamayı indir</a>
  </div>
</main>
<div data-footer></div>
<script>
addEventListener("DOMContentLoaded",async()=>{
  const code=((new URLSearchParams(location.search).get("c")||"")||new URLSearchParams(location.search).get("c")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
  document.getElementById("code").textContent=code||"······";
  document.getElementById("open").href="maziturkiye://challenge/"+code;
  document.getElementById("store").href=MAZI.storeLink();
  document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText("MAZI "+code);document.getElementById("copy").textContent="Kopyalandı ✓";}catch{}};
  if(!code)return;
  try{const c=await MAZI.rpc("public_challenge",{p_code:code});if(c){
    document.getElementById("num").textContent=(c.number>0?"#"+c.number+" · ":"")+"Meydan okuma";
    document.getElementById("title").textContent=c.creator_name+" "+c.creator_total.toLocaleString("tr-TR")+" puan yaptı";
    document.getElementById("sub").textContent="Aynı 5 fotoğrafta onu geçebilir misin?";}}catch{}
});
</script>
</body></html>
